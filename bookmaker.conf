# Nginx configuration for BookMaker.eu FastAPI Service
# Location: /etc/nginx/sites-available/bookmaker

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bookmaker.eternitylabs.co;

    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bookmaker.eternitylabs.co;

    # SSL certificates (using Cloudflare certs)
    ssl_certificate /home/ubuntu/deploy/eternitylabs_cf/ssl_cert.pem;
    ssl_certificate_key /home/ubuntu/deploy/eternitylabs_cf/ssl_key.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Increase timeouts for large JSON responses
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Increase buffer sizes
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Proxy to BookMaker runner (FastAPI on port 8055)
    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8055/health;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Access logs
    access_log /var/log/nginx/bookmaker_access.log;
    error_log /var/log/nginx/bookmaker_error.log;
}
